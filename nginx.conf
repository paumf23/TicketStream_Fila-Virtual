# ═══════════════════════════════════════════════════════════════════════════════
# nginx.conf — Proxy Inverso para Virtual Queue (Producción)
# ═══════════════════════════════════════════════════════════════════════════════
# Todo el tráfico entra por Nginx (puertos 80 y 443).
# HTTP redirige a HTTPS. HTTPS proxea internamente a los servicios.
#
# Certificados SSL:
#   Los certificados los gestiona Certbot (Let's Encrypt).
#   Antes del primer despliegue, ejecutar:
#     ./init-letsencrypt.sh
#   para generar certificados temporales y que Nginx pueda arrancar.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Upstreams (servicios internos de Docker) ──────────────────────────────────
upstream frontend {
    server frontend:3000;
}

upstream api {
    server api:8000;
}

# ═══════════════════════════════════════════════════════════════════════════════
# SERVIDOR HTTP (:80) — Redirige todo a HTTPS
# Excepto: /.well-known/acme-challenge/ (necesario para Certbot)
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name ticketstream.ddns.net;

    # Certbot necesita este endpoint para validar el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═══════════════════════════════════════════════════════════════════════════════
# SERVIDOR HTTPS (:443) — Proxy inverso principal
# ═══════════════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name ticketstream.ddns.net;

    # ── Certificados SSL (Let's Encrypt / Certbot) ────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/ticketstream.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ticketstream.ddns.net/privkey.pem;

    # ── Parámetros SSL recomendados ───────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de seguridad ──────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Tamaño máximo de request body ─────────────────────────────────────────
    client_max_body_size 10M;

    # ══════════════════════════════════════════════════════════════════════════
    # RUTAS — API Backend (FastAPI)
    # ══════════════════════════════════════════════════════════════════════════

    # --- Endpoints REST de la API ---
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (actualizaciones en tiempo real) ---
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # 24h — mantener conexiones WS abiertas
        proxy_send_timeout 86400;
    }

    # --- Health check del backend ---
    location /health {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    # --- Documentación Swagger ---
    location /docs {
        proxy_pass http://api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass http://api;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # RUTA — Frontend (Next.js) — Todo lo que no matcheó arriba
    # ══════════════════════════════════════════════════════════════════════════

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js internal (hot reload en standalone, _next assets) ---
    location /_next/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
    }
}
