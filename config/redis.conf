
# ═══════════════════════════════════════════════════════════════════════════════
# Configuración para el Motor de Cola Virtual
# ═══════════════════════════════════════════════════════════════════════════════

# Persistencia: Guardar datos en disco periódicamente (RDB) y en cada operación (AOF)
# Esto asegura que la cola no se pierda si el contenedor se reinicia.
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"

# Memoria: Configuración para manejar picos de usuarios
# 10.000 clientes simultáneos es un límite seguro para este sistema
maxclients 10000

# Política de desalojo: Si se llena la memoria, no borrar datos de la cola (noeviction)
# Es preferible que el sistema dé error antes de que se pierda la fila de alguien.
maxmemory 256mb
maxmemory-policy noeviction

# Seguridad (opcional para desarrollo local, desactivado)
# requirepass secret

# Nivel de Log
loglevel notice
