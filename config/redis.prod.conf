
# ═══════════════════════════════════════════════════════════════════════════════
# Configuración de Redis para PRODUCCIÓN
# ═══════════════════════════════════════════════════════════════════════════════
# Diferencias respecto a redis.conf (desarrollo):
#   - Memoria subida de 256mb a 512mb
#   - tcp-keepalive activado (detecta conexiones muertas cada 60 segundos)
#   - La contraseña se inyecta desde docker-compose.prod.yml (--requirepass)
# ═══════════════════════════════════════════════════════════════════════════════

# Persistencia: Guardar datos en disco periódicamente (RDB) y en cada operación (AOF)
# Esto asegura que la cola no se pierda si el contenedor se reinicia.
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfilename "appendonly.aof"

# Memoria: Límite subido para manejar picos de usuarios en producción
maxclients 10000
maxmemory 512mb
maxmemory-policy noeviction

# Conexiones: Verificar que las conexiones siguen vivas cada 60 segundos
# Previene que se acumulen conexiones fantasma
tcp-keepalive 60

# Nivel de Log
loglevel notice
